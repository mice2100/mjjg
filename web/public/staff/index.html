<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jade Garden POS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- One app at /staff/, /staff/pos/ (opens on Order) and /staff/kitchen/ (opens on Kitchen).
     Absolute paths: the same file is served at all three addresses. The old screen is /staff/classic/. -->
<link rel="stylesheet" href="/staff/staff.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Jade Garden</h1><small>Moose Jaw</small></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="topright">
      <span class="sync" id="sync" role="status"></span>
      <button class="tbtn" id="oskBtn" type="button" data-act="osk" title="Switch between the on-screen keyboard and the tablet's own keyboard">Keyboard</button>
      <button class="tbtn" id="soundBtn" type="button" data-act="sound">Sound on</button>
      <div class="clock" id="clock"></div>
    </div>
  </header>
  <div id="ringbar" class="ringbar" role="alert" hidden></div>
  <main id="main"></main>
</div>
<div id="modal" class="modal-wrap" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<!-- Plain scripts sharing one global scope, in this order. -->
<script src="/staff/js/core.js"></script>
<script src="/staff/js/keyboard.js"></script>
<script src="/staff/js/order.js"></script>
<script src="/staff/js/start.js"></script>
<script src="/staff/js/register.js"></script>
<script src="/staff/js/kitchen.js"></script>
<script src="/staff/js/menu.js"></script>
<script src="/staff/js/main.js"></script>
</body>
</html>
